title: "大语言模型排序器"
type: community
group: Generative AI
order: 4
image: /static/templates/llm-ranker.png
details: |
  <h1>Rank and compare LLM responses</h1>
  <dl>
    <dt>Industry Applications</dt>
    <dd>model evaluation, A/B testing, model comparison, performance ranking, response quality, model benchmarking, AI model selection, bias detection, fairness evaluation, AI safety, red teaming, harmful content, model auditing, responsible AI, chatbot evaluation, conversational AI, customer service AI, content generation</dd>
    <dt>Associated Models</dt>
    <dd>RLHF, reward modeling, constitutional AI, alignment, fine-tuning, instruction tuning</dd>
    <dt>Domain Terminology</dt>
    <dd>gen AI, human feedback, preference learning, prompt engineering</dd>
  </dl>
config: |
  <View>
     <View style="display: flex; align-items: center; font-size: 1em;">
        <View style="margin: var(--spacing-tight) var(--spacing-tight) 0 0;">
          <Header value="任务：" style="font-size: 1em;"/>
        </View>
        <Text name="task" value="$task"/>
      </View>
     <View style="display: flex; align-items: center; box-shadow: 0px 2px 5px 0px rgba(var(--color-neutral-shadow-raw) / 10%); padding: var(--spacing-tight); border-radius: 5px; background-color: var(--color-neutral-background); font-size: 1.25em; border: 1px solid var(--color-neutral-border); margin-bottom: var(--spacing-tight);">
        <View style="margin: 0 1em 0 0">
          <Header value="提示："  />
        </View>
        <Text name="prompt" value="$prompt"/>
      </View>
      <View>
        <List name="answers" value="$items" title="所有结果" />
        <Style>
          .htx-ranker-column {
            background: var(--color-neutral-background);
            width: 50%;
            padding: var(--spacing-tight);
            border-radius: var(--corner-radius-smaller);
            box-shadow: 0px 2px 5px 0px rgba(var(--color-neutral-shadow-raw) / 10%);
            border: 1px solid var(--color-neutral-border);
          }
      
          .htx-ranker-item {
            background: var(--color-neutral-surface);
            color: var(--color-neutral-content);
            font-size: 16px;
            width: 100%;
            padding: var(--spacing-tight);
            margin-bottom: var(--spacing-tight);
            border-radius: var(--corner-radius-smaller);
            box-shadow: 0px 2px 5px 0px rgba(var(--color-neutral-shadow-raw) / 10%);
            border: 1px solid var(--color-neutral-border);
          }
          
          
          .htx-ranker-item:hover {
            background: var(--color-neutral-surface-hover);
          }
          
          .htx-ranker-item p:last-child { display: none }
        </Style>
        <Ranker name="rank" toName="answers">
      <Bucket name="relevant_results" title="相关结果" />
      <Bucket name="biased_results" title="偏差结果" />
    </Ranker> 
      </View>
    </View>
