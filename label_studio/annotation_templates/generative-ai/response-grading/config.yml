title: 大语言模型回复评分
type: community
group: Generative AI
order: 6
image: /static/templates/response-grading.png
details: |
  <h1>Assign a grade to LLM responses based on how well it meets your internal guidelines</h1>
  <dl>
    <dt>Industry Applications</dt>
    <dd>model evaluation, content quality assessment, educational assessment, AI tutoring systems, automated grading, writing assessment, customer service evaluation, chatbot quality control, academic writing, student response evaluation, content moderation, LLM benchmarking, AI evaluation</dd>
    <dt>Associated Models</dt>
    <dd>human evaluation, quality metrics, response scoring, rubric-based assessment</dd>
    <dt>Domain Terminology</dt>
    <dd>gen AI, response quality, content grading, automated assessment, performance rating</dd>
  </dl>
config: |
  <View>
    <Style>
      .root {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      .container {
        display: flex;
        flex: 1;
      }
      .block {
        flex: 1;
        padding: 20px;
        box-sizing: border-box;
      }
      .scrollable {
        overflow-y: auto;
        height: calc(100vh - 80px); /* Adjust height to accommodate header and footer */
      }
      .long-document {
        background-color: #f9f9f9;
        border-right: 1px solid #ddd;
      }
      .short-summary {
        background-color: #f1f1f1;
      }
      .summary-rating {
        padding: 20px;
        background-color: #c3bcbc;
        border-top: 1px solid #ddd;
        text-align: center;
      }
      h2 {
        margin-top: 0;
      }
    </Style>

    <View className="root">
      <View className="container">
        <View className="block long-document scrollable">
          <Header value="长文档"/>
          <Text name="document" value="$document"/>
        </View>

       <View className="block short-summary">
         <Header value="简短摘要"/>
         <Text name="summary" value="$summary"/>
       </View>
      </View>

      <View className="summary-rating">
        <Header value="对文档摘要进行评分："/>
        <Rating name="rating" toName="summary" required="true"/>
      </View>
    </View>
  </View>

